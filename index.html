<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>이질적 경제주체 동태 일반균형 모형</title>
<style>
:root{--bg:#f5f2e9;--surface:#fffdf6;--ink:#20293a;--muted:#7a745f;--rule:#ded3b8;
  --gold:#c9a75c;--accent:#8f6b24;--accent-strong:#6e5117}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b2c;--surface:#1c2538;--ink:#e8e3d6;--muted:#9a937f;--rule:#2f3a52;
  --gold:#c9a75c;--accent:#d8b76a;--accent-strong:#e6c988}}
:root[data-theme="dark"]{--bg:#141b2c;--surface:#1c2538;--ink:#e8e3d6;--muted:#9a937f;
  --rule:#2f3a52;--gold:#c9a75c;--accent:#d8b76a;--accent-strong:#e6c988}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px 16px;
  font-family:"Noto Sans KR","Malgun Gothic",-apple-system,sans-serif;line-height:1.7}
.card{background:var(--surface);border:1px solid var(--rule);border-top:3px solid var(--gold);
  border-radius:4px;max-width:440px;width:100%;padding:30px 28px}
h1{font-family:"Noto Serif KR",Georgia,"Malgun Gothic",serif;font-size:20px;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted);margin:0 0 20px}
p{font-size:14px;color:var(--muted);margin:0 0 16px}
form{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 180px;min-width:0;padding:11px 13px;font-size:15px;border-radius:3px;
  border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
input:focus{outline:none;border-color:var(--accent)}
button{border:none;border-radius:3px;background:var(--accent);color:#fffdf6;
  font-size:15px;font-weight:600;padding:11px 22px;cursor:pointer;font-family:inherit}
button:hover{background:var(--accent-strong)}
button:disabled{opacity:.55;cursor:default}
:root[data-theme="dark"] button,:root:not([data-theme="light"]) button{color:#141b2c}
#msg{font-size:13px;margin:14px 0 0;min-height:19px}
#msg.err{color:#b5452f}
</style>
</head>
<body>
<div class="card">
  <h1>이질적 경제주체 동태 일반균형 모형</h1>
  <p class="sub">배병호 · 강태수</p>
  <p>이 자료는 암호로 보호되어 있습니다. 저자에게 받으신 암호를 입력하십시오.</p>
  <form id="f">
    <input type="password" id="pw" autocomplete="current-password" autofocus placeholder="암호">
    <button id="go" type="submit">열기</button>
  </form>
  <p id="msg"></p>
</div>

function b64bytes(s) {
  var bin = atob(s), n = bin.length, u = new Uint8Array(n);
  for (var i = 0; i < n; i++) u[i] = bin.charCodeAt(i);
  return u;
}
async function unlock(pw) {
  var km = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  var key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64bytes(SALT), iterations: ITER, hash: "SHA-256" },
    km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  // 암호가 틀리면 GCM 인증 태그 검증에서 예외가 난다.
  var plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64bytes(IV) }, key, b64bytes(PAYLOAD));
  var ds = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return await new Response(ds).text();
}
function say(s, bad) {
  var m = document.getElementById("msg");
  m.textContent = s || "";
  m.className = bad ? "err" : "";
}
document.getElementById("f").addEventListener("submit", async function (e) {
  e.preventDefault();
  var pw = document.getElementById("pw").value, btn = document.getElementById("go");
  if (!pw) { say("암호를 입력하십시오.", true); return; }
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") {
    say("이 브라우저에서는 열 수 없습니다 — Chrome·Edge·Safari 최신 버전을 쓰십시오.", true);
    return;
  }
  btn.disabled = true;
  say("여는 중…");
  var html;
  try {
    html = await unlock(pw);
  } catch (err) {
    btn.disabled = false;
    say("암호가 맞지 않습니다.", true);
    document.getElementById("pw").select();
    return;
  }
  // 본문(PDF 뷰어)이 암호화된 PDF를 열 때 쓴다. 탭을 닫으면 지워진다.
  try { sessionStorage.setItem("dsgePw", pw); } catch (err) {}
  document.open();
  document.write(html);
  document.close();
});
